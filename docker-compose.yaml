services:
  master:
    container_name: master
    build:
      context: .
      dockerfile: build/master/Dockerfile
    environment:
      - SERVER_PORT=${MASTER_PORT}
      - SERVER_ADVERTISE_ADDR=${MASTER_HOST}:${MASTER_PORT}
      - SVC_HEALTHY_DURATION=10s
      - NFS_ROOT=${NFS_ROOT}
      - INPUT_PATTERN=**/*.txt
    volumes:
      - ${HOST_IN_DIR}:${NFS_ROOT}:z

  worker-1:
    container_name: worker-1
    build:
      context: .
      dockerfile: build/worker/Dockerfile
    environment:
      - NAME=worker-1
      - SERVER_PORT=5000
      - SERVER_ADVERTISE_ADDR=worker-1:5000
      - SVC_MASTER_ADDR=${MASTER_HOST}:${MASTER_PORT}
      - SVC_HEARTBEAT_INTERVAL=5s
      - SVC_HEARTBEAT_TIMEOUT=3s
      - NFS_ROOT=${NFS_ROOT}
    volumes:
      - ${HOST_IN_DIR}:${NFS_ROOT}:z
    depends_on:
      - master

  worker-2:
    container_name: worker-2
    build:
      context: .
      dockerfile: build/worker/Dockerfile
    environment:
      - NAME=worker-2
      - SERVER_PORT=5000
      - SERVER_ADVERTISE_ADDR=worker-2:5000
      - SVC_MASTER_ADDR=${MASTER_HOST}:${MASTER_PORT}
      - SVC_HEARTBEAT_INTERVAL=2s
      - SVC_HEARTBEAT_TIMEOUT=1s
      - NFS_ROOT=${NFS_ROOT}
    volumes:
      - ${HOST_IN_DIR}:${NFS_ROOT}:z
    depends_on:
      - master
